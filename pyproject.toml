[project]
name = "newscout"
version = "0.1.0"
description = "A self-hosted newsroom that collects your RSS feeds and lets AI merge and rewrite them into one clean news list."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["flask", "feedparser", "httpx"]

[project.optional-dependencies]
prod = ["gunicorn"]

[project.scripts]
newscout = "newscout.__main__:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newscout"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
